'use strict';let KEY='phone-life-ios18-v1';let defaults=()=>({profile:{name:'Jai',nickname:'Jai',bio:'今天也要好好生活 ✨',relation:'我的故事，从这里开始。',avatar:'',wallpaper:''},contacts:[{id:'c1',name:'小夏',nickname:'Xia',bio:'永远站在你这边。',relation:'好朋友',avatar:'',reply:'你说得对！|哈哈哈，听起来好有意思|我在呢，慢慢说～'},{id:'c2',name:'阿澈',nickname:'Chen',bio:'喜欢音乐和深夜散步。',relation:'朋友',avatar:'',reply:'刚刚看到消息～|好呀，下次一起！|今天过得怎么样？'}],chats:{c1:[{from:'them',text:'早安！今天有什么安排？',at:Date.now()-3600000}],c2:[{from:'them',text:'分享一首最近很喜欢的歌给你 🎵',at:Date.now()-7200000}]},photos:[],tracks:[{id:'t1',title:'Midnight Memories',artist:'Phone Life',url:''},{id:'t2',title:'Lavender Sky',artist:'Your Playlist',url:''}],settings:{autoReply:true,accent:'#7359df',locked:false}});let state;try{state=JSON.parse(localStorage.getItem(KEY))||defaults()}catch{state=defaults()}function normalize(){let d=defaults();state.profile={...d.profile,...state.profile};state.contacts=Array.isArray(state.contacts)?state.contacts:d.contacts;state.chats=state.chats&&typeof state.chats==='object'?state.chats:{};state.photos=Array.isArray(state.photos)?state.photos:[];state.tracks=Array.isArray(state.tracks)?state.tracks:d.tracks;state.settings={...d.settings,...state.settings}}normalize();let currentApp='',activeChat='',activePhoto='',activeTrack=0,audio=new Audio(),toastTimer,replyTimers=[];function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('本地空间不足：请减少照片或导出备份');return false}}function el(id){return document.getElementById(id)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){el('toast').textContent=s;el('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el('toast').style.display='none',2600)}function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function avatar(c){return c.avatar?`<span class="avatar" style="background-image:url('${esc(c.avatar)}')"></span>`:`<span class="avatar">${esc((c.name||'?').slice(0,1))}</span>`}function dateClock(){let d=new Date();el('statusTime').textContent=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});el('lockTime').textContent=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});el('lockDate').textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}dateClock();setInterval(dateClock,15000);const icons=[['messages','信息','💬','linear-gradient(140deg,#6ee86c,#22ad43)'],['contacts','通讯录','👤','linear-gradient(140deg,#a8a8b5,#727384)'],['photos','照片','🌸','linear-gradient(140deg,#fff,#eae4f4)'],['music','音乐','♫','linear-gradient(140deg,#fa759d,#e82d6c)'],['profile','角色','✨','linear-gradient(140deg,#c7a5fc,#7754c7)'],['notes','备忘录','📝','linear-gradient(140deg,#fff,#f3e9bc)'],['settings','设置','⚙','linear-gradient(140deg,#b1b3c1,#777d92)'],['about','关于','♥','linear-gradient(140deg,#f7abc6,#b99ae7)']];function renderHome(){el('widgetName').textContent=state.profile.nickname||state.profile.name;el('widgetBio').textContent=state.profile.bio;el('welcome').textContent='你好，'+state.profile.name+' · 欢迎回家';el('widgetTrack').textContent=state.tracks[activeTrack]?.title||'你的私人歌单';el('apps').innerHTML=icons.map(([id,n,g,b])=>`<button class="app" onclick="openApp('${id}')"><span class="app-icon" style="background:${b};color:${['photos','notes'].includes(id)?'#635b73':'white'}">${g}</span>${n}</button>`).join('');el('dock').innerHTML=['messages','contacts','photos','music'].map(id=>{let [_,n,g,b]=icons.find(x=>x[0]===id);return `<button class="app" aria-label="${n}" onclick="openApp('${id}')"><span class="app-icon" style="background:${b};color:${id==='photos'?'#635b73':'white'}">${g}</span></button>`}).join('');el('wall').style.backgroundImage=state.profile.wallpaper?`url('${state.profile.wallpaper}')`:'';document.documentElement.style.setProperty('--accent',state.settings.accent)}function openApp(id){currentApp=id;el('appScreen').classList.add('active');el('chatView').classList.remove('active');el('photoView').classList.remove('active');renderApp()}function homeScreen(){closeChat();closePhoto();currentApp='';el('appScreen').classList.remove('active');renderHome()}function goBack(){if(el('chatView').classList.contains('active'))return closeChat();if(el('photoView').classList.contains('active'))return closePhoto();homeScreen()}function nav(title,action='',fn=''){el('appHeading').textContent=title;let b=el('navAction');b.textContent=action;b.onclick=fn?window[fn]:null;b.style.visibility=action?'visible':'hidden'}function renderApp(){let m={messages:renderMessages,contacts:renderContacts,photos:renderPhotos,music:renderMusic,profile:renderProfile,notes:renderNotes,settings:renderSettings,about:renderAbout};(m[currentApp]||renderAbout)()}function renderMessages(){nav('信息','新信息','newChat');let ids=Object.keys(state.chats).filter(id=>state.contacts.some(c=>c.id===id));ids.sort((a,b)=>(state.chats[b]?.at(-1)?.at||0)-(state.chats[a]?.at(-1)?.at||0));el('appContent').innerHTML=`<h1 class="bigtitle">信息</h1><input class="search" id="messageSearch" placeholder="⌕ 搜索信息或联系人" oninput="filterMessages()"><div class="card chat-list" id="messageRows">${messageRows(ids)}</div>`}function messageRows(ids){return ids.length?ids.map(id=>{let c=state.contacts.find(x=>x.id===id),last=state.chats[id]?.at(-1);return `<button class="item" onclick="openChat('${id}')">${avatar(c)}<span class="grow"><strong>${esc(c.name)}</strong><p>${esc(last?.text||'开始聊天吧')}</p></span><span class="chev">›</span></button>`}).join(''):'<div class="empty"><span class="emoji">💬</span>还没有聊天，点击右上角新信息</div>'}function filterMessages(){let q=el('messageSearch').value.toLowerCase(),ids=Object.keys(state.chats).filter(id=>{let c=state.contacts.find(x=>x.id===id);return c&&(c.name.toLowerCase().includes(q)||state.chats[id].some(m=>m.text.toLowerCase().includes(q)))});el('messageRows').innerHTML=messageRows(ids)}function newChat(){nav('选择联系人');el('appContent').innerHTML=`<h1 class="bigtitle">新信息</h1><div class="card">${state.contacts.map(c=>`<button class="item" onclick="openChat('${c.id}')">${avatar(c)}<span class="grow"><strong>${esc(c.name)}</strong></span><span class="chev">›</span></button>`).join('')||'请先添加联系人'}</div>`}function openChat(id){let c=state.contacts.find(x=>x.id===id);if(!c)return;activeChat=id;state.chats[id]??=[];el('chatName').textContent=c.name;el('chatAvatar').outerHTML=`<div class="avatar" id="chatAvatar" style="width:37px;height:37px;${c.avatar?`background-image:url('${esc(c.avatar)}')`:''}">${c.avatar?'':esc(c.name.slice(0,1))}</div>`;el('chatView').classList.add('active');renderChat()}function renderChat(){el('chatMessages').innerHTML=(state.chats[activeChat]||[]).map(m=>`<div class="bubble ${m.from==='me'?'mine':'theirs'}">${esc(m.text)}</div>`).join('')||'<div class="empty">发送第一条消息吧 ✨</div>';el('chatMessages').scrollTop=el('chatMessages').scrollHeight}function closeChat(){el('chatView').classList.remove('active');activeChat='';if(currentApp==='messages')renderMessages()}el('chatForm').addEventListener('submit',e=>{e.preventDefault();let input=el('chatInput'),txt=input.value.trim(),id=activeChat;if(!txt||!id)return;state.chats[id].push({from:'me',text:txt,at:Date.now()});input.value='';save();renderChat();if(state.settings.autoReply){let timer=setTimeout(()=>{let c=state.contacts.find(x=>x.id===id);if(!c)return;let choices=(c.reply||'收到啦！|我在听～').split('|').map(s=>s.trim()).filter(Boolean);state.chats[id]??=[];state.chats[id].push({from:'them',text:choices[Math.floor(Math.random()*choices.length)],at:Date.now()});save();if(activeChat===id)renderChat()},900+Math.random()*800);replyTimers.push(timer)}});function editActiveContact(){if(!activeChat)return;editContact(activeChat)}function renderContacts(){nav('通讯录','＋ 添加','addContact');el('appContent').innerHTML=`<h1 class="bigtitle">通讯录</h1><input class="search" id="contactSearch" placeholder="⌕ 搜索联系人" oninput="filterContacts()"><div class="card" id="contactRows">${contactRows(state.contacts)}</div>`}function contactRows(cs){return cs.length?cs.map(c=>`<button class="item" onclick="editContact('${c.id}')">${avatar(c)}<span class="grow"><strong>${esc(c.name)}</strong><p>${esc(c.relation||c.nickname||'联系人')}</p></span><span class="chev">›</span></button>`).join(''):'<div class="empty">暂无联系人，添加一个吧</div>'}function filterContacts(){let q=el('contactSearch').value.toLowerCase();el('contactRows').innerHTML=contactRows(state.contacts.filter(c=>[c.name,c.nickname,c.relation].join(' ').toLowerCase().includes(q)))}function addContact(){editContact('')}function editContact(id){let c=state.contacts.find(x=>x.id===id)||{id:'',name:'',nickname:'',bio:'',relation:'',avatar:'',reply:'收到啦！|我在呢～|好呀！'};nav(id?'编辑联系人':'新联系人');el('chatView').classList.remove('active');el('appContent').innerHTML=`<h1 class="bigtitle">${id?'编辑联系人':'新联系人'}</h1><form id="contactForm" class="card"><label class="field">姓名<input name="name" required maxlength="40" value="${esc(c.name)}"></label><label class="field">昵称<input name="nickname" maxlength="40" value="${esc(c.nickname)}"></label><label class="field">关系<input name="relation" maxlength="80" value="${esc(c.relation)}"></label><label class="field">人物简介<textarea name="bio">${esc(c.bio)}</textarea></label><label class="field">头像（可选）<input name="avatar" type="file" accept="image/*"></label><label class="field">自动回复候选句（用 | 分隔）<textarea name="reply">${esc(c.reply)}</textarea></label><div class="row"><button class="primary" type="submit">保存联系人</button>${id?`<button class="secondary-btn" type="button" onclick="openChat('${id}')">进入聊天</button><button class="danger" type="button" onclick="deleteContact('${id}')">删除</button>`:''}</div></form>`;el('contactForm').onsubmit=async e=>{e.preventDefault();let f=e.currentTarget,v=new FormData(f),name=String(v.get('name')||'').trim();if(!name)return toast('请填写姓名');let img=f.elements.avatar.files[0],a=img?await imageData(img):c.avatar;if(img&&!a)return;let obj={id:id||uid(),name,nickname:String(v.get('nickname')||''),relation:String(v.get('relation')||''),bio:String(v.get('bio')||''),avatar:a,reply:String(v.get('reply')||'')};if(id)Object.assign(state.contacts.find(x=>x.id===id),obj);else state.contacts.push(obj);save();renderContacts();toast('联系人已保存')}}function deleteContact(id){if(!confirm('确定删除这个联系人和全部聊天记录？'))return;state.contacts=state.contacts.filter(c=>c.id!==id);delete state.chats[id];save();renderContacts();toast('已删除')}
function renderProfile(){nav('角色编辑');let p=state.profile;el('appContent').innerHTML=`<h1 class="bigtitle">我的角色</h1><div class="card" style="text-align:center">${avatar(p)}<h2>${esc(p.name)}</h2><div class="muted">你的世界，由你定义</div></div><form class="card" id="profileForm"><label class="field">角色姓名<input name="name" required maxlength="40" value="${esc(p.name)}"></label><label class="field">昵称<input name="nickname" maxlength="40" value="${esc(p.nickname)}"></label><label class="field">个人签名<input name="bio" maxlength="160" value="${esc(p.bio)}"></label><label class="field">人物背景 / 关系设定<textarea name="relation">${esc(p.relation)}</textarea></label><label class="field">上传角色头像<input type="file" name="avatar" accept="image/*"></label><label class="field">上传桌面壁纸<input type="file" name="wallpaper" accept="image/*"></label><div class="row"><button class="primary">保存角色</button><button type="button" class="secondary-btn" onclick="clearWallpaper()">移除壁纸</button></div></form>`;el('profileForm').onsubmit=async e=>{e.preventDefault();let f=e.currentTarget,v=new FormData(f);for(let k of ['name','nickname','bio','relation'])state.profile[k]=String(v.get(k)||'');for(let k of ['avatar','wallpaper'])if(f.elements[k].files[0]){let d=await imageData(f.elements[k].files[0],k==='wallpaper'?1100:500);if(d)state.profile[k]=d}save();renderHome();renderProfile();toast('角色已保存')}}function clearWallpaper(){state.profile.wallpaper='';save();renderHome();toast('已移除壁纸')}
async function imageData(file,max=950){if(!file.type.startsWith('image/')){toast('请选择图片');return null}return new Promise(resolve=>{let reader=new FileReader();reader.onerror=()=>{toast('读取图片失败');resolve(null)};reader.onload=()=>{let im=new Image();im.onerror=()=>{toast('图片无法解析');resolve(null)};im.onload=()=>{let scale=Math.min(1,max/Math.max(im.width,im.height)),can=document.createElement('canvas');can.width=Math.max(1,Math.round(im.width*scale));can.height=Math.max(1,Math.round(im.height*scale));can.getContext('2d').drawImage(im,0,0,can.width,can.height);resolve(can.toDataURL('image/jpeg',.78))};im.src=reader.result};reader.readAsDataURL(file)})}function renderPhotos(){nav('照片','＋ 添加','addPhotos');el('appContent').innerHTML=`<h1 class="bigtitle">照片</h1><p class="top-note">${state.photos.length} 张照片 · 图片压缩后保存在本地</p>${state.photos.length?`<div class="photos">${state.photos.map(p=>`<button class="photo" onclick="openPhoto('${p.id}')"><img loading="lazy" src="${p.data}" alt="${esc(p.name)}"></button>`).join('')}</div>`:'<div class="empty"><span class="emoji">🌷</span>把生活中的美好瞬间收藏在这里</div>'}`};function addPhotos(){el('fileInput').click()}el('fileInput').onchange=async e=>{let files=[...e.target.files].slice(0,15),added=0;for(let f of files){let data=await imageData(f);if(data){state.photos.push({id:uid(),name:f.name,data,at:Date.now()});added++}}if(!save()&&added)state.photos.splice(-added);el('fileInput').value='';if(currentApp==='photos')renderPhotos();toast('已添加 '+added+' 张照片')};function openPhoto(id){let p=state.photos.find(x=>x.id===id);if(!p)return;activePhoto=id;el('photoFull').src=p.data;el('photoView').classList.add('active')}function closePhoto(){el('photoView').classList.remove('active');activePhoto=''}function deletePhoto(){if(!confirm('删除这张照片？'))return;state.photos=state.photos.filter(x=>x.id!==activePhoto);save();closePhoto();renderPhotos()}
function renderMusic(){nav('音乐','＋ 歌曲','addTrack');let t=state.tracks[activeTrack];if(!t&&state.tracks.length){activeTrack=0;t=state.tracks[0]}el('appContent').innerHTML=`<h1 class="bigtitle">音乐</h1><div class="music-cover">♫</div><div style="text-align:center"><h2 style="margin:0">${esc(t?.title||'暂无歌曲')}</h2><p class="muted">${esc(t?.artist||'添加喜欢的音乐')}</p></div><div class="music-controls row" style="justify-content:center;margin:22px 0"><button onclick="prevTrack()">⏮</button><button class="play" id="playBtn" onclick="togglePlay()">${audio.paused?'▶':'Ⅱ'}</button><button onclick="nextTrack()">⏭</button></div><p class="top-note">添加音频 URL（MP3 等）可直接播放；示例歌曲仅用于展示。</p><div class="section">我的歌单</div><div class="card">${state.tracks.map((x,i)=>`<button class="item" onclick="selectTrack(${i})"><span style="font-size:24px">${i===activeTrack?'🎵':'♫'}</span><span class="grow"><strong>${esc(x.title)}</strong><p>${esc(x.artist)}</p></span><span class="chev">${i===activeTrack?'●':'›'}</span></button>`).join('')||'<div class="muted">歌单为空</div>'}</div>${t?`<button class="danger" onclick="deleteTrack()">删除当前歌曲</button>`:''}`};function addTrack(){nav('添加歌曲');el('appContent').innerHTML=`<h1 class="bigtitle">添加音乐</h1><form id="trackForm" class="card"><label class="field">歌曲名<input name="title" required maxlength="100"></label><label class="field">歌手<input name="artist" maxlength="100"></label><label class="field">音频直链（https://，例如 MP3 文件）<input name="url" type="url" placeholder="https://example.com/music.mp3"></label><button class="primary">添加到歌单</button></form><p class="muted">部分音乐网站禁止跨域播放。请使用你有权播放的公开音频直链。</p>`;el('trackForm').onsubmit=e=>{e.preventDefault();let f=e.currentTarget,v=new FormData(f),url=String(v.get('url')||'').trim();if(url&&!/^https:\/\//i.test(url))return toast('请填写 HTTPS 音频链接');state.tracks.push({id:uid(),title:String(v.get('title')),artist:String(v.get('artist')),url});save();activeTrack=state.tracks.length-1;renderMusic();toast('歌曲已添加')}}function selectTrack(i){activeTrack=i;audio.pause();audio.removeAttribute('src');renderMusic();renderHome()}function togglePlay(){let t=state.tracks[activeTrack];if(!t?.url)return toast('这首歌还没有音频链接，请添加带 HTTPS 直链的歌曲');if(audio.src!==t.url){audio.src=t.url;audio.load()}if(audio.paused)audio.play().catch(()=>toast('无法播放：请检查链接或音频格式'));else audio.pause();setTimeout(()=>{let b=el('playBtn');if(b)b.textContent=audio.paused?'▶':'Ⅱ'},200)}function nextTrack(){if(!state.tracks.length)return;selectTrack((activeTrack+1)%state.tracks.length)}function prevTrack(){if(!state.tracks.length)return;selectTrack((activeTrack-1+state.tracks.length)%state.tracks.length)}function deleteTrack(){if(!confirm('删除当前歌曲？'))return;state.tracks.splice(activeTrack,1);activeTrack=0;audio.pause();audio.removeAttribute('src');save();renderMusic()}audio.onended=nextTrack;
function renderNotes(){nav('备忘录');el('appContent').innerHTML=`<h1 class="bigtitle">备忘录</h1><div class="card"><label class="field">写下你想记住的事情<textarea id="noteText" style="min-height:310px" placeholder="今天发生了什么有趣的事？">${esc(state.notes||'')}</textarea></label><button class="primary" onclick="saveNote()">保存备忘录</button></div>`}function saveNote(){state.notes=el('noteText').value;save();toast('备忘录已保存')}
function renderSettings(){nav('设置');el('appContent').innerHTML=`<h1 class="bigtitle">设置</h1><div class="section">互动体验</div><div class="card"><div class="item"><span class="grow"><strong>本地自动回复</strong><p>按联系人设置的候选语句随机回复</p></span><input class="switch" type="checkbox" ${state.settings.autoReply?'checked':''} onchange="setAutoReply(this.checked)"></div><div class="item"><span class="grow"><strong>锁定手机</strong><p>模拟 iPhone 锁屏</p></span><button class="secondary-btn" onclick="toggleLock(true)">立即锁定</button></div><div class="item"><span class="grow"><strong>主题强调色</strong></span><input type="color" value="${esc(state.settings.accent)}" onchange="setAccent(this.value)" aria-label="主题颜色"></div></div><div class="section">数据与隐私</div><div class="card"><button class="item" onclick="exportBackup()"><span class="grow"><strong>导出完整备份</strong><p>下载 JSON，包含聊天、联系人和照片</p></span><span class="chev">↗</span></button><button class="item" onclick="el('backupInput').click()"><span class="grow"><strong>导入备份</strong><p>替换当前手机中的数据</p></span><span class="chev">›</span></button><button class="item" onclick="resetAll()"><span class="grow"><strong style="color:#d23b57">恢复出厂设置</strong><p>清除本机全部模拟器数据</p></span><span class="chev">›</span></button></div><p class="footer-hint">数据只存储在当前浏览器的 localStorage。<br>清理浏览器数据或使用无痕模式可能造成丢失，请定期导出备份。</p>`}function setAutoReply(v){state.settings.autoReply=v;save()}function setAccent(v){state.settings.accent=v;save();renderHome()}function toggleLock(v){el('lock').classList.toggle('active',v);if(v)homeScreen()}function exportBackup(){let blob=new Blob([JSON.stringify({format:'phone-life-ios18',version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='phone-life-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('备份已下载')}el('backupInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(x.format!=='phone-life-ios18'||!x.data||!Array.isArray(x.data.contacts)||!Array.isArray(x.data.photos)||!x.data.profile)throw Error('格式不正确');if(!confirm('导入备份将覆盖当前全部数据，确定继续？'))return;state=x.data;normalize();save();renderHome();renderSettings();toast('备份已恢复')}catch(err){toast('导入失败：'+err.message)}finally{e.target.value=''}};function resetAll(){if(!confirm('确定清空所有角色、聊天、照片和设置？此操作无法撤销。'))return;replyTimers.forEach(clearTimeout);audio.pause();state=defaults();activeTrack=0;save();renderHome();renderSettings();toast('已恢复初始数据')}function renderAbout(){nav('关于');el('appContent').innerHTML=`<h1 class="bigtitle">Phone Life ✦</h1><div class="card"><h2>属于你的口袋宇宙</h2><p>一个以现代 iOS 18 为灵感的虚构手机生活模拟器。</p><p class="muted">版本 2.0 · 纯 HTML / CSS / JavaScript · 无需后端</p></div><div class="card"><strong>包含的功能</strong><p>角色与壁纸、联系人、iMessage 风格聊天、可配置自动回复、相册、音乐、备忘录、主题设置、JSON 备份。</p><p class="muted">本地自动回复不是真正的生成式 AI。真实 AI 聊天需要另外配置 API 和安全的服务端代理。</p></div><p class="footer-hint">本项目为独立界面设计，不隶属于 Apple。</p>`}document.addEventListener('keydown',e=>{if(e.key==='Escape')goBack()});renderHome();if(state.settings.locked)toggleLock(true);
</script><script src="ios.js"></script><script src="wallpaper.js"></script><script src="weibo.js"></script></body></html>
