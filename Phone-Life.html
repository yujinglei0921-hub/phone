}">${g}</span></button>`}).join('');el('wall').style.backgroundImage=state.profile.wallpaper?`url('${state.profile.wallpaper}')`:'';document.documentElement.style.setProperty('--accent',state.settings.accent)}function openApp(id){currentApp=id;el('appScreen').classList.add('active');el('chatView').classList.remove('active');el('photoView').classList.remove('active');renderApp()}function homeScreen(){closeChat();closePhoto();currentApp='';el('appScreen').classList.remove('active');renderHome()}function goBack(){if(el('chatView').classList.contains('active'))return closeChat();if(el('photoView').classList.contains('active'))return closePhoto();homeScreen()}function nav(title,action='',fn=''){el('appHeading').textContent=title;let b=el('navAction');b.textContent=action;b.onclick=fn?window[fn]:null;b.style.visibility=action?'visible':'hidden'}function renderApp(){let m={messages:renderMessages,contacts:renderContacts,photos:renderPhotos,music:renderMusic,profile:renderProfile,notes:renderNotes,settings:renderSettings,about:renderAbout};(m[currentApp]||renderAbout)()}function renderMessages(){nav('信息','新信息','newChat');let ids=Object.keys(state.chats).filter(id=>state.contacts.some(c=>c.id===id));ids.sort((a,b)=>(state.chats[b]?.at(-1)?.at||0)-(state.chats[a]?.at(-1)?.at||0));el('appContent').innerHTML=`<h1 class="bigtitle">信息</h1><input class="search" id="messageSearch" placeholder="⌕ 搜索信息或联系人" oninput="filterMessages()"><div class="card chat-list" id="messageRows">${messageRows(ids)}</div>`}function messageRows(ids){return ids.length?ids.map(id=>{let c=state.contacts.find(x=>x.id===id),last=state.chats[id]?.at(-1);return `<button class="item" onclick="openChat('${id}')">${avatar(c)}<span class="grow"><strong>${esc(c.name)}</strong><p>${esc(last?.text||'开始聊天吧')}</p></span><span class="chev">›</span></button>`}).join(''):'<div class="empty"><span class="emoji">💬</span>还没有聊天，点击右上角新信息</div>'}function filterMessages(){let q=el('messageSearch').value.toLowerCase(),ids=Object. if(!activeChat)return;editContact(activeChat)}function renderContacts(){nav('通讯录','＋ 添加','addContact');el('appContent').innerHTML=`<h1 class="bigtitle">通讯录</h1><input class="search" id="contactSearch" placeholder="⌕ 搜索联系人" oninput="filterContacts()"><div class="card" id="contactRows">${contactRows(state.contacts)}</div>`}function contactRows(cs){return cs.length?cs.map(c=>`<button class="item" onclick="editContact('${c.id}')">${avatar(c)}<span class="grow"><strong>${esc(c.name)}</strong><p>${esc(c.relation||c.nickname||'联系人')}</p></span><span class="chev">›</span></button>`).join(''):'<div class="empty">暂无联系人，添加一个吧</div>'}function filterContacts(){let q=el('contactSearch').value.toLowerCase();el('contactRows').innerHTML=contactRows(state.contacts.filter(c=>[c.name,c.nickname,c.relation].join(' ').toLowerCase().includes(q)))}function addContact(){editContact('')}function editContact(id){let c=state.contacts.find(x=>x.id===id)||{id:'',name:'',nickname:'',bio:'',relation:'',avatar:'',reply:'收到啦！|我在呢～|好呀！'};nav(id?'编辑联系人':'新联系人');el('chatView').classList.remove('active');el('appContent').innerHTML=`<h1 class="bigtitle">${id?'编辑联系人':'新联系人'}</h1><form id="contactForm" class="card"><label class="field">姓名<input name="name" required maxlength="40" value="${esc(c.name)}"></label><label class="field">昵称<input name="nickname" maxlength="40" value="${esc(c.nickname)}"></label><label class="field">关系<input name="relation" maxlength="80" value="${esc(c.relation)}"></label><label class="field">人物简介<textarea name="bio">${esc(c.bio)}</textarea></label><label class="field">头像（可选）<input name="avatar" type="file" accept="image/*"></label><label class="field">自动回复候选句（用 | 分隔）<textarea name="reply">${esc(c.reply)}</textarea></label><div class="row"><button class="primary" type="submit">保存联系人</button>${id?`<button class="secondary-btn" type="button" onclick="openChat('${id}')">进入聊天</button><button class="danger" type="button" onclick="deleteContact('${id}')">删除</button>`:''}</div></form>`;el('contactForm').onsubmit=async e=>{e.preventDefault();let f=e.currentTarget,v=new FormData(f),name=String(v.get('name')||'').trim();if(!name)return toast('请填写姓名');let img=f.elements.avatar.files[0],a=img?await imageData(img):c.avatar;if(img&&!a)return;let obj={id:id||uid(),name,nickname:String(v.get('nickname')||''),relation:String(v.get('relation')||''),bio:String(v.get('bio')||''),avatar:a,reply:String(v.get('reply')||'')};if(id)Object.assign(state.contacts.find(x=>x.id===id),obj);else state.contacts.push(obj);save();renderContacts();toast('联系人已保存')}}function deleteContact(id){if(!confirm('确定删除这个联系人和全部聊天记录？'))return;state.contacts=state.contacts.filter(c=>c.id!==id);delete state.chats[id];save();renderContacts();toast('已删除')}
function renderProfile(){nav('角色编辑');let p=state.profile;el('appContent').innerHTML=`<h1 class="bigtitle">我的角色</h1><div class="card" style="text-align:center">${avatar(p)}<h2>${esc(p.name)}</h2><div class="muted">你的世界，由你定义</div></div><form class="card" id="profileForm"><label class="field">角色姓名<input name="name" required maxlength="40" value="${esc(p.name)}"></label><label class="field">昵称<input name="nickname" maxlength="40" value="${esc(p.nickname)}"></label><label class="field">个人签名<input name="bio" maxlength="160" value="${esc(p.bio)}"></label><label class="field">人物背景 / 关系设定<textarea name="relation">${esc(p.relation)}</textarea></label><label class="field">上传角色头像<input type="file" name="avatar" accept="image/*"></label><label class="field">上传桌面壁纸<input type="file" name="wallpaper" accept="image/*"></label><div class="row"><button class="primary">保存角色</button><button type="button" class="secondary-btn" onclick="clearWallpaper()">移除壁纸</button></div></form>`;el('profileForm').onsubmit=async e=>{e.preventDefault();let f=e.currentTarget,v=new FormData(f);for(let k of ['name','nickname','bio','relation'])state.profile[k]=String(v.get(k)||'');for(let k of ['avatar','wallpaper'])if(f.elements[k].files[0]){let d=await imageData(f.elements[k].files[0],k==='wallpaper'?1100:500);if(d)state.profile[k]=d}save();renderHome();renderProfile();toast('角色已保存')}}function clearWallpaper(){state.profile.wallpaper='';save();renderHome();toast('已移除壁纸')}
async function imageData(file,max=950){if(!file.type.startsWith('image/')){toast('请选择图片');return null}return new Promise(resolve=>{let reader=new FileReader();reader.onerror=()=>{toast('读取图片失败');resolve(null)};reader.onload=()=>{let im=new Image();im.onerror=()=>{toast('图片无法解析');resolve(null)};im.onload=()=>{let scale=Math.min(1,max/Math.max(im.width,im.height)),can=document.createElement('canvas');can.width=Math.max(1,Math.round(im.width*scale));can.height=Math.max(1,Math.round(im.height*scale));can.getContext('2d').drawImage(im,0,0,can.width,can.height);resolve(can.toDataURL('image/jpeg',.78))};im.src=reader.result};reader.readAsDataURL(file)})}function renderPhotos(){nav('照片','＋ 添加','addPhotos');el('appContent').innerHTML=`<h1 class="bigtitle">照片</h1><p class="top-note">${state.photos.length} 张照片 · 图片压缩后保存在本地</p>${state.photos.length?`<div class="photos">${state.photos.map(p=>`<button class="photo" onclick="openPhoto('${p.id}')"><img loading="lazy" src="${p.data}" alt="${esc(p.name)}"></button>`).join('')}</div>`:'<div class="empty"><span class="emoji">🌷</span>把生活中的美好瞬间收藏在这里</div>'}`};function addPhotos(){el('fileInput').click()}el('fileInput').onchange=async e=>{let files=[...e.target.files].slice(0,15),added=0;for(let f of files){let data=await imageData(f);if(data){state.photos.push({id:uid(),name:f.name,data,at:Date.now()});added++}}if(!save()&&added)state.photos.splice(-added);el('fileInput').value='';if(currentApp==='photos')renderPhotos();toast('已添加 '+added+' 张照片')};function openPhoto(id){let p=state.photos.find(x=>x.id===id);if(!p)return;activePhoto=id;el('photoFull').src=p.data;el('photoView').classList.add('active')}function closePhoto(){el('photoView').classList.remove('active');activePhoto=''}function deletePhoto(){if(!confirm('删除这张照片？'))return;state.photos=state.photos.filter(x=>x.id!==activePhoto);save();closePhoto();renderPhotos()}
function renderMusic(){nav('音乐','＋ 歌曲','addTrack');let t=state.tracks[activeTrack];if(!t&&state.tracks.length){activeTrack=0;t=state.tracks[0]}el('appContent').innerHTML=`<h1 class="bigtitle">音乐</h1><div class="music-cover">♫</div><div style="text-align:center"><h2 style="margin:0">${esc(t?.title||'暂无歌曲')}</h2><p class="muted">${esc(t?.artist||'添加喜欢的音乐')}</p></div><div class="music-controls row" style="justify-content:center;margin:22px 0"><button onclick="prevTrack()">⏮</button><button class="play" id="playBtn" onclick="togglePlay()">${audio.paused?'▶':'Ⅱ'}</button><button onclick="nextTrack()">⏭</button></div><p class="top-note">添加音频 URL（MP3 等）可直接播放；示例歌曲仅用于展示。</p><div class="section">我的歌单</div><div class="card">${state.tracks.map((x,i)=>`<button class="item" onclick="selectTrack(${i})"><span style="font-size:24px">${i===activeTrack?'🎵':'♫'}</span><span class="grow"><strong>${esc(x.title)}</strong><p>${esc(x.artist)}</p></span><span class="chev">${i===activeTrack?'●':'›'}</span></button>`).join('')||'<div class="muted">歌单为空</div>'}</div>${t?`<button class="danger" onclick="deleteTrack()">删除当前歌曲</button>`:''}`};function addTrack(){nav('添加歌曲');el('appContent').innerHTML=`<h1 class="bigtitle">添加音乐</h1><form id="trackForm" class="card"><label class="field">歌曲名<input name="title" required maxlength="100"></label><label class="field">歌手<input name="artist" maxlength="100"></label><label class="field">音频直链（https://，例如 MP3 文件）<input name="url" type="url" placeholder="https://example.com/music.mp3"></label><button class="primary">添加到歌单</button></form><p class="muted">部分音乐网站禁止跨域播放。请使用你有权播放的公开音频直链。</p>`;el('trackForm').onsubmit=e=>{e.preventDefault();let f=e.currentTarget,v=new FormData(f),url=String(v.get('url')||'').trim();if(url&&!/^https:\/\//i.test(url))return toast('请填写 HTTPS 音频链接');state.tracks.push({id:uid(),title:String(v.get('title')),artist:String(v.get('artist')),url});save();activeTrack=state.tracks.length-1;renderMusic();toast('歌曲已添加')}}function selectTrack(i){activeTrack=i;audio.pause();audio.removeAttribute('src');renderMusic();renderHome()}function togglePlay(){let t=state.tracks[activeTrack];if(!t?.url)return toast('这首歌还没有音频链接，请添加带 HTTPS 直链的歌曲');if(audio.src!==t.url){audio.src=t.url;audio.load()}if(audio.paused)audio.play().catch(()=>toast('无法播放：请检查链接或音频格式'));else audio.pause();setTimeout(()=>{let b=el('playBtn');if(b)b.textContent=audio.paused?'▶':'Ⅱ'},200)}function nextTrack(){if(!state.tracks.length)return;selectTrack((activeTrack+1)%state.tracks.length)}function prevTrack(){if(!state.tracks.length)return;selectTrack((activeTrack-1+state.tracks.length)%state.tracks.length)}function deleteTrack(){if(!confirm('删除当前歌曲？'))return;state.tracks.splice(activeTrack,1);activeTrack=0;audio.pause();audio.removeAttribute('src');save();renderMusic()}audio.onended=nextTrack;
function renderNotes(){nav('备忘录');el('appContent').innerHTML=`<h1 class="bigtitle">备忘录</h1><div class="card"><label class="field">写下你想记住的事情<textarea id="noteText" style="min-height:310px" placeholder="今天发生了什么有趣的事？">${esc(state.notes||'')}</textarea></label><button class="primary" onclick="saveNote()">保存备忘录</button></div>`}function saveNote(){state.notes=el('noteText').value;save();toast('备忘录已保存')}
function renderSettings(){nav('设置');el('appContent').innerHTML=`<h1 class="bigtitle">设置</h1><div class="section">互动体验</div><div class="card"><div class="item"><span class="grow"><strong>本地自动回复</strong><p>按联系人设置的候选语句随机回复</p></span><input class="switch" type="checkbox" ${state.settings.autoReply?'checked':''} onchange="setAutoReply(this.checked)"></div><div class="item"><span class="grow"><strong>锁定手机</strong><p>模拟 iPhone 锁屏</p></span><button class="secondary-btn" onclick="toggleLock(true)">立即锁定</button></div><div class="item"><span class="grow"><strong>主题强调色</strong></span><input type="color" value="${esc(state.settings.accent)}" onchange="setAccent(this.value)" aria-label="主题颜色"></div></div><div class="section">数据与隐私</div><div class="card"><button class="item" onclick="exportBackup()"><span class="grow"><strong>导出完整备份</strong><p>下载 JSON，包含聊天、联系人和照片</p></span><span class="chev">↗</span></button><button class="item" onclick="el('backupInput').click()"><span class="grow"><strong>导入备份</strong><p>替换当前手机中的数据</p></span><span class="chev">›</span></button><button class="item" onclick="resetAll()"><span class="grow"><strong style="color:#d23b57">恢复出厂设置</strong><p>清除本机全部模拟器数据</p></span><span class="chev">›</span></button></div><p class="footer-hint">数据保存在当前浏览器的本机存储中。<br>清理浏览器数据或使用无痕模式可能造成丢失，请定期导出备份。</p>`}function setAutoReply(v){state.settings.autoReply=v;save()}function setAccent(v){state.settings.accent=v;save();renderHome()}function toggleLock(v){el('lock').classList.toggle('active',v);if(v)homeScreen()}function exportBackup(){let blob=new Blob([JSON.stringify({format:'phone-life-ios18',version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='phone-life-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('备份已下载')}el('backupInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(x.format!=='phone-life-ios18'||!x.data||!Array.isArray(x.data.contacts)||!Array.isArray(x.data.photos)||!x.data.profile)throw Error('格式不正确');if(!confirm('导入备份将覆盖当前全部数据，确定继续？'))return;state=x.data;normalize();save();renderHome();renderSettings();toast('备份已恢复')}catch(err){toast('导入失败：'+err.message)}finally{e.target.value=''}};function resetAll(){if(!confirm('确定清空所有角色、聊天、照片和设置？此操作无法撤销。'))return;replyTimers.forEach(clearTimeout);audio.pause();state=defaults();activeTrack=0;save();renderHome();renderSettings();toast('已恢复初始数据')}function renderAbout(){nav('关于');el('appContent').innerHTML=`<h1 class="bigtitle">Phone Life ✦</h1><div class="card"><h2>属于你的口袋宇宙</h2><p>一个以现代 iOS 18 为灵感的虚构手机生活模拟器。</p><p class="muted">版本 2.0 · 纯 HTML / CSS / JavaScript · 无需后端</p></div><div class="card"><strong>包含的功能</strong><p>角色与壁纸、联系人、iMessage 风格聊天、可配置自动回复、相册、音乐、备忘录、主题设置、JSON 备份。</p><p class="muted">本地自动回复不是真正的生成式 AI。真实 AI 聊天需要另外配置 API 和安全的服务端代理。</p></div><p class="footer-hint">本项目为独立界面设计，不隶属于 Apple。</p>`}document.addEventListener('keydown',e=>{if(e.key==='Escape')goBack()});renderHome();if(state.settings.locked)toggleLock(true);

function applyLockWallpaper(){el('lock').style.backgroundImage=state.settings.lockWallpaper?`url("${state.settings.lockWallpaper}")`:defaultWall}
let pinBuffer='',pinFailures=0,pinCooldown=0;
const lockGlyph=svg('<rect x="12" y="22" width="24" height="20" rx="5" fill="white"/><path d="M17 22v-7a7 7 0 0 1 14 0v7" stroke="white" stroke-width="4"/>');
el('lock').insertAdjacentHTML('afterbegin',`<div class="lock-symbol" style="width:24px;height:24px">${lockGlyph}</div>`);el('lock').insertAdjacentHTML('beforeend','<div class="lock-shortcuts"><span>☼</span><span>◎</span></div><div id="pinPanel" class="pin-panel hide"></div>');el('lock').querySelector('.unlock').onclick=requestUnlock;
toggleLock=v=>{if(!v)return requestUnlock();baseHome();el('shell').classList.remove('in-app');el('shell').classList.add('is-locked');state.settings.locked=true;save();el('lock').classList.add('active');el('pinPanel').classList.add('hide');pinBuffer='';applyLockWallpaper()};
function completeUnlock(){el('lock').classList.remove('active');el('shell').classList.remove('is-locked');el('pinPanel').classList.add('hide');state.settings.locked=false;save();pinBuffer='';pinFailures=0;renderHome()}
function requestUnlock(){if(!state.settings.pin)return completeUnlock();pinBuffer='';renderPin()}
function renderPin(){const panel=el('pinPanel');panel.classList.remove('hide');panel.innerHTML=`<div style="width:28px;height:28px;margin-bottom:13px">${lockGlyph}</div><h2>输入密码</h2><div class="pin-dots" id="pinDots">${'○'.repeat(state.settings.pin.length)}</div><div class="pin-error" id="pinError" role="status"></div><div class="pin-pad">${['1','2','3','4','5','6','7','8','9','','0',''].map((x,i)=>x?`<button class="pin-key" aria-label="密码 ${x}" onclick="pinDigit('${x}')">${x}<small>${['','ABC','DEF','GHI','JKL','MNO','PQRS','TUV','WXYZ','','',''][i]||'&nbsp;'}</small></button>`:'<span></span>').join('')}</div><div class="pin-footer"><button class="pin-text" onclick="el('pinPanel').classList.add('hide');pinBuffer=''">取消</button><button class="pin-text" onclick="pinBuffer=pinBuffer.slice(0,-1);updatePinDots()">删除</button></div>`}
function updatePinDots(){el('pinDots').textContent='●'.repeat(pinBuffer.length)+'○'.repeat(state.settings.pin.length-pinBuffer.length)}
function pinDigit(x){if(Date.now()<pinCooldown){el('pinError').textContent='尝试次数较多，请稍后再试';return}if(pinBuffer.length>=state.settings.pin.length)return;pinBuffer+=x;updatePinDots();if(pinBuffer.length===state.settings.pin.length){if(pinBuffer===state.settings.pin)completeUnlock();else{pinFailures++;pinBuffer='';updatePinDots();el('pinError').textContent='密码错误，请重试';if(pinFailures>=5){pinCooldown=Date.now()+30000;pinFailures=0;el('pinError').textContent='请等待 30 秒后重试'}}}}
document.addEventListener('keydown',e=>{if(!isLocked())return;if(e.key==='Escape'){el('pinPanel').classList.add('hide');return}if(el('pinPanel').classList.contains('hide')){if(e.key==='Enter')requestUnlock();return}if(/^\d$/.test(e.key)){e.preventDefault();pinDigit(e.key)}else if(e.key==='Backspace'){pinBuffer=pinBuffer.slice(0,-1);updatePinDots()}},true);
let touchStartY=0;el('lock').addEventListener('touchstart',e=>touchStartY=e.touches[0].clientY,{passive:true});el('lock').addEventListener('touchend',e=>{if(el('pinPanel').classList.contains('hide')&&touchStartY-e.changedTouches[0].clientY>60)requestUnlock()},{passive:true});
function renderPersonalize(){nav('壁纸与密码');const lw=state.settings.lockWallpaper?`url('${state.settings.lockWallpaper}')`:defaultWall,hw=state.profile.wallpaper?`url('${state.profile.wallpaper}')`:defaultWall;el('appContent').innerHTML=`<h1 class="bigtitle">让手机属于你</h1><div class="wall-previews"><div class="wall-preview" style="background-image:${esc(lw)}">锁定屏幕<b>09:41</b><span>星期五 · 属于你的故事</span></div><div class="wall-preview" style="background-image:${esc(hw)}">主屏幕<b>▦ ▦</b><i>▪ ▪ ▪ ▪</i><i>▪ ▪ ▪ ▪</i></div></div><form id="wallForm" class="card" style="margin-top:18px"><label class="field">锁屏壁纸<input name="lockwall" type="file" accept="image/*"></label><label class="field">主屏幕壁纸<input name="homewall" type="file" accept="image/*"></label><button class="primary">保存壁纸</button><div class="settings-grid" style="margin-top:12px"><button type="button" class="secondary-btn" onclick="restoreWall('lock')">重置锁屏壁纸</button><button type="button" class="secondary-btn" onclick="restoreWall('home')">重置主屏幕壁纸</button></div></form><form id="pinForm" class="card"><strong>${state.settings.pin?'更改锁屏密码':'设置锁屏密码'}</strong><p class="muted">用于故事和模拟解锁，不是设备级安全保护。请勿使用真实手机密码；备份文件会包含模拟密码。</p>${state.settings.pin?'<label class="field">当前密码<input name="old" type="password" inputmode="numeric" autocomplete="off" required></label>':''}<label class="field">新密码（4 位或 6 位数字）<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}|[0-9]{6}" maxlength="6" required autocomplete="new-password"></label><label class="field">再次输入密码<input name="confirmPin" type="password" inputmode="numeric" maxlength="6" required autocomplete="new-password"></label><div class="row"><button class="primary">保存密码</button>${state.settings.pin?'<button type="button" class="danger" onclick="removePin()">关闭密码</button>':''}</div></form><button class="secondary-btn" onclick="toggleLock(true)">立即锁屏试玩</button>`;
el('wallForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;const oldHome=state.profile.wallpaper,oldLock=state.settings.lockWallpaper;for(const [name,key] of [['lockwall','lock'],['homewall','home']]){const file=f.elements[name].files[0];if(file){const data=await imageData(file,1200);if(!data)return;if(key==='lock')state.settings.lockWallpaper=data;else state.profile.wallpaper=data}}if(!save()){state.profile.wallpaper=oldHome;state.settings.lockWallpaper=oldLock;return}renderHome();renderPersonalize();toast('两张壁纸已独立保存')};el('pinForm').onsubmit=e=>{e.preventDefault();const f=e.currentTarget;if(state.settings.pin&&f.elements.old.value!==state.settings.pin)return toast('当前密码不正确');const pin=f.elements.pin.value;if(!/^(\d{4}|\d{6})$/.test(pin))return toast('请输入 4 位或 6 位数字');if(pin!==f.elements.confirmPin.value)return toast('两次密码不一致');state.settings.pin=pin;if(save()){renderPersonalize();toast('密码已设置，下次锁屏生效')}}}
function restoreWall(type){if(type==='lock')state.settings.lockWallpaper='';else state.profile.wallpaper='';save();renderHome();renderPersonalize()}
function removePin(){const f=el('pinForm');if(f.elements.old.value!==state.settings.pin)return toast('请先填写正确的当前密码');state.settings.pin='';save();renderPersonalize();toast('已关闭锁屏密码')}
function renderWeather(){nav('天气','编辑','editWeather');const w=state.weather;el('appContent').innerHTML=`<div class="weather-large"><h2>${esc(w.city)}</h2><div class="temp">${esc(w.temp)}°</div><p>${esc(w.condition)}</p><p>最高 ${esc(w.high)}° · 最低 ${esc(w.low)}°</p><div style="font-size:70px;margin-top:25px">${w.condition.includes('雨')?'☂':'☀'}</div></div><div class="card"><strong>故事里的天气</strong><p class="muted">这是可编辑的模拟天气，不连接实时天气服务。点按右上角编辑，桌面小组件同步更新。</p></div>`}
function editWeather(){nav('编辑天气');const w=state.weather;el('appContent').innerHTML=`<h1 class="bigtitle">今天的天气</h1><form id="weatherForm" class="card">${[['city','城市','text'],['temp','温度','number'],['high','最高温度','number'],['low','最低温度','number']].map(([k,n,t])=>`<label class="field">${n}<input name="${k}" type="${t}" value="${esc(w[k])}" required ${t==='number'?'min="-80" max="60"':''}></label>`).join('')}<label class="field">天气状况<select name="condition">${['晴','晴间多云','多云','阴','小雨','大雨','雪'].map(x=>`<option ${x===w.condition?'selected':''}>${x}</option>`).join('')}</select></label><button class="primary">保存天气</button></form>`;el('weatherForm').onsubmit=e=>{e.preventDefault();const v=new FormData(e.currentTarget);const weather={city:v.get('city'),condition:v.get('condition'),temp:+v.get('temp'),high:+v.get('high'),low:+v.get('low')};if(weather.low>weather.high)return toast('最低温度不能高于最高温度');state.weather=weather;save();renderHome();renderWeather();toast('桌面天气已更新')}}
function renderSocial(type){const red=type==='redbook';nav(red?'小红书':'微博','＋ 发布',red?'newRedbook':'newWeibo');const posts=state.social[type];el('appContent').innerHTML=red?`<div class="feed-tabs"><span>关注</span><strong>发现</strong><span>附近</span></div><input class="search" placeholder="搜索生活灵感" oninput="filterSocial('redbook',this.value)"><div class="redbook-grid" id="socialPosts">${posts.map(p=>postHTML(type,p)).join('')}</div><div class="tabbar"><b>首页</b><span>探索生活 · 发布你的故事</span></div>`:`<div class="feed-tabs"><strong>关注</strong><span>热门</span><span>实时</span></div><input class="search" placeholder="搜索微博" oninput="filterSocial('weibo',this.value)"><div id="socialPosts">${posts.map(p=>postHTML(type,p)).join('')}</div>`}
function postHTML(type,p){const red=type==='redbook';return red?`<article class="social-card"><button class="social-cover" style="width:100%;padding:0" onclick="viewPost('${type}','${p.id}')">${p.cover?`<img src="${esc(p.cover)}" alt="${esc(p.title)}">`:`<span class="cover-text">${esc(p.title)}</span>`}</button><div class="social-body"><button class="bare" style="text-align:left;font-weight:600" onclick="viewPost('${type}','${p.id}')">${esc(p.title)}</button><div class="social-meta"><span>${esc(p.author)}</span><button class="bare" onclick="likePost('${type}','${p.id}')">${p.liked?'♥':'♡'} ${p.likes||0}</button></div></div></article>`:`<article class="weibo-post"><header>${avatar({name:p.author})}<span><strong>${esc(p.author)}</strong><div class="muted" style="font-size:10px">来自 Phone Life · 故事动态</div></span></header><div style="white-space:pre-wrap">${esc(p.body)}</div>${p.cover?`<img src="${esc(p.cover)}" alt="动态照片">`:''}<div class="post-actions"><button class="bare" onclick="editPost('weibo','${p.id}')">编辑</button><button class="bare" onclick="viewPost('weibo','${p.id}')">查看</button><button class="bare" onclick="likePost('weibo','${p.id}')">${p.liked?'♥':'♡'} ${p.likes||0}</button></div></article>`}
function filterSocial(type,q){el('socialPosts').innerHTML=state.social[type].filter(p=>(p.title+p.body+p.author).includes(q)).map(p=>postHTML(type,p)).join('')||'<p class="muted">没有找到相关内容</p>'}
function newRedbook(){editPost('redbook','')}function newWeibo(){editPost('weibo','')}
function likePost(type,id){const p=state.social[type].find(x=>x.id===id);if(!p)return;p.liked=!p.liked;p.likes=Math.max(0,(+p.likes||0)+(p.liked?1:-1));save();renderSocial(type)}
function viewPost(type,id){const p=state.social[type].find(x=>x.id===id);if(!p)return;nav('动态详情');el('appContent').innerHTML=`<h1 class="bigtitle">${esc(p.title||p.author+'的微博')}</h1><div class="card"><p class="muted">${esc(p.author)}</p>${p.cover?`<img style="width:100%;border-radius:12px" src="${esc(p.cover)}" alt="动态图片">`:''}<p class="web-content">${esc(p.body)}</p><div class="row"><button class="primary" onclick="editPost('${type}','${id}')">编辑内容</button><button class="danger" onclick="deletePost('${type}','${id}')">删除</button><button class="secondary-btn" onclick="renderSocial('${type}')">返回动态</button></div></div>`}
function editPost(type,id){const p=state.social[type].find(x=>x.id===id)||{author:state.profile.name,title:'',body:'',cover:''};nav(id?'编辑动态':'发布动态');el('appContent').innerHTML=`<h1 class="bigtitle">${type==='redbook'?'记录生活灵感':'分享此刻'}</h1><form class="card" id="postForm"><label class="field">发布人<input name="author" value="${esc(p.author)}" maxlength="40" required></label>${type==='redbook'?`<label class="field">标题<input name="title" value="${esc(p.title)}" maxlength="80" required></label>`:''}<label class="field">正文<textarea name="body" required maxlength="6000" style="min-height:160px">${esc(p.body)}</textarea></label><label class="field">${p.cover?'替换配图':'上传配图'}<input name="cover" type="file" accept="image/*"></label><label class="field"><span><input type="checkbox" name="removeCover" style="display:inline;width:auto"> 移除已有配图</span></label><button class="primary">保存动态</button></form>`;el('postForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,v=new FormData(f);let cover=v.get('removeCover')?'':p.cover;if(f.elements.cover.files[0]){cover=await imageData(f.elements.cover.files[0]);if(!cover)return}const post={...p,id:id||uid(),author:String(v.get('author')),title:String(v.get('title')||''),body:String(v.get('body')),cover,likes:p.likes||0};const prev=structuredClone(state.social[type]);if(id)state.social[type]=state.social[type].map(x=>x.id===id?post:x);else state.social[type].unshift(post);if(!save()){state.social[type]=prev;return}renderSocial(type);toast('动态已保存')}}
function deletePost(type,id){if(!confirm('删除这条动态？'))return;state.social[type]=state.social[type].filter(x=>x.id!==id);save();renderSocial(type)}

function startCall(){if(!dialNumber)return toast('请先输入号码');if(el('callScreen'))return;callSeconds=0;const screen=document.createElement('div');screen.id='callScreen';screen.className='call-screen';screen.innerHTML=`<div class="avatar">☎</div><h2>${esc(dialNumber)}</h2><p>模拟通话 · 不连接真实电话</p><div id="callDuration">00:00</div><button class="call-end" onclick="endCall()" aria-label="结束通话">⌁</button><p style="font-size:12px">结束通话</p>`;el('shell').append(screen);callInterval=setInterval(()=>{callSeconds++;el('callDuration').textContent=String(Math.floor(callSeconds/60)).padStart(2,'0')+':'+String(callSeconds%60).padStart(2,'0')},1000)}
function endCall(){clearInterval(callInterval);if(!el('callScreen'))return;state.callHistory.unshift({number:dialNumber,at:Date.now(),seconds:callSeconds});state.callHistory=state.callHistory.slice(0,100);save();el('callScreen').remove();toast('模拟通话已结束')}

function renderSafari(){nav('Safari','＋ 页面','newWebpage');el('appContent').innerHTML=`<form class="safari-bar" id="safariForm"><input id="safariAddress" aria-label="Safari 地址" placeholder="搜索模拟网页或输入网址"><button class="secondary-btn">前往</button></form><div class="safari-favorites"><div class="section">个人收藏</div><button class="baidu-shortcut" onclick="renderBaidu()" aria-label="百度搜索记录"><span class="baidu-shortcut-icon">du<span>●</span></span><span>百度</span></button></div><div class="safari-hero"><span class="studio-kicker">YOUR LITTLE INTERNET</span><h2>每个页面，<br>都能藏一条线索。</h2><p class="muted">编辑属于故事的网页，或跳转真实网站。</p></div><div class="section">故事网页 · 可离线浏览</div><div class="card" id="webResults">${state.webpages.map(p=>`<button class="item" onclick="viewWeb('${p.id}')"><span style="font-size:24px">◈</span><span class="grow"><strong>${esc(p.title)}</strong><p>${esc(p.url)}</p></span><span class="chev">›</span></button>`).join('')||'<p class="muted">点击右上角添加故事网页</p>'}</div>`;el('safariForm').onsubmit=e=>{e.preventDefault();const q=el('safariAddress').value.trim();if(!q)return;if(isBaiduAddress(q))return renderBaidu();const p=state.webpages.find(x=>x.url===q||x.title.includes(q));if(p)return viewWeb(p.id);let url;try{url=new URL(q);if(!['http:','https:'].includes(url.protocol))throw Error()}catch{return toast('未找到模拟网页，请输入完整的 http(s) 网址')}nav('外部网站');el('appContent').innerHTML=`<div class="card"><h2>打开外部网站</h2><p class="muted">真实网站将在新标签页打开。此模拟浏览器不嵌入外部网页。</p><a class="primary" style="display:inline-block;text-decoration:none" target="_blank" rel="noopener noreferrer" href="${esc(url.href)}">${esc(url.hostname)} ↗</a><p><button class="bare" onclick="renderSafari()">返回 Safari</button></p></div>`}}

function editWeb(id){const p=state.webpages.find(x=>x.id===id)||{title:'',url:'https://story.local/',body:''};nav(id?'编辑网页':'添加网页');el('appContent').innerHTML=`<form id="webForm" class="card"><label class="field">网页标题<input name="title" value="${esc(p.title)}" required maxlength="100"></label><label class="field">模拟网址<input name="url" type="url" value="${esc(p.url)}" required></label><label class="field">页面内容（纯文本）<textarea name="body" style="min-height:240px" required>${esc(p.body)}</textarea></label><div class="row"><button class="primary">保存网页</button>${id?`<button type="button" class="danger" onclick="deleteWeb('${id}')">删除</button>`:''}</div></form>`;el('webForm').onsubmit=e=>{e.preventDefault();const v=new FormData(e.currentTarget);let u;try{u=new URL(v.get('url'));if(!['https:','http:'].includes(u.protocol))throw Error()}catch{return toast('请使用 http(s) 网址')}const obj={id:id||uid(),title:String(v.get('title')),url:u.href,body:String(v.get('body'))};if(id)Object.assign(p,obj);else state.webpages.push(obj);save();viewWeb(obj.id)}}

function renderStory(){nav('故事线','＋ 节点','newStoryNode');const s=state.story;el('appContent').innerHTML=`<h1 class="bigtitle">编排你的故事</h1><p class="muted">节点按顺序推进；只有当前节点会响应触发事件。剧情状态包含在 JSON 备份里。</p><div class="card"><div class="item"><span class="grow"><strong>剧情运行</strong><p>${s.enabled?'正在等待下一个触发条件':'编辑模式，暂不触发剧情'}</p></span><input aria-label="剧情运行" type="checkbox" class="switch" ${s.enabled?'checked':''} onchange="state.story.enabled=this.checked;save();renderStory()"></div><div class="row story-controls"><button class="secondary-btn" onclick="manualStory()">触发当前手动节点</button><button class="secondary-btn" onclick="restartStory()">重置进度</button><button class="secondary-btn" onclick="loadStoryDemo()">载入示例</button></div><p class="muted">已完成 ${s.done.length} / ${s.nodes.length} 个节点</p></div>${s.nodes.map((n,i)=>`<div class="card story-node"><span class="badge">${s.done.includes(n.id)?'已完成':s.nodes.find(x=>!s.done.includes(x.id))?.id===n.id?'当前节点':'等待中'}</span><h3>${i+1}. ${esc(n.title)}</h3><p class="muted">${{manual:'手动触发',app:'打开应用',message:'发送关键词',chat:'打开指定聊天'}[n.trigger]}${n.trigger==='app'?' · '+appName(n.target):n.trigger==='message'?' · '+esc(n.keyword):n.trigger==='chat'?' · '+esc(state.contacts.find(c=>c.id===n.contact)?.name||'未找到联系人'):''} → ${{message:'微信消息',note:'追加备忘录',redbook:'小红书动态',weibo:'微博动态',call:'联系人来电'}[n.action]}</p><div class="story-controls"><button class="secondary-btn" onclick="editStoryNode('${n.id}')">编辑</button><button class="secondary-btn" onclick="moveStoryNode('${n.id}',-1)" ${i===0?'disabled':''}>↑</button><button class="secondary-btn" onclick="moveStoryNode('${n.id}',1)" ${i===s.nodes.length-1?'disabled':''}>↓</button><button class="danger" onclick="deleteStoryNode('${n.id}')">删除</button></div></div>`).join('')||'<div class="empty">从一条短信，开始一个故事。<br><br>添加节点，或载入示例。</div>'}`}
function appName(id){return icons.find(x=>x[0]===id)?.[1]||({phone:'电话',safari:'Safari',weather:'天气'})[id]||id}
function newStoryNode(){editStoryNode('')}
function editStoryNode(id){const n=state.story.nodes.find(x=>x.id===id)||{title:'',trigger:'app',target:'messages',keyword:'',contact:state.contacts[0]?.id||'',action:'message',body:''};nav(id?'编辑剧情节点':'新剧情节点');el('appContent').innerHTML=`<form id="storyForm" class="card"><label class="field">节点名称<input name="title" value="${esc(n.title)}" required maxlength="80"></label><label class="field">触发方式<select name="trigger" onchange="storyFieldVisibility()">${[['app','打开应用'],['chat','打开指定聊天'],['message','发送关键词'],['manual','手动推进']].map(([v,t])=>`<option value="${v}" ${n.trigger===v?'selected':''}>${t}</option>`).join('')}</select></label><label class="field" id="storyAppField">目标应用<select name="target">${[...icons.map(x=>x[0]),'phone','safari','weather'].map(x=>`<option value="${x}" ${n.target===x?'selected':''}>${appName(x)}</option>`).join('')}</select></label><label class="field" id="storyKeywordField">关键词（发送的消息包含这段文字）<input name="keyword" value="${esc(n.keyword)}"></label><label class="field">剧情效果<select name="action" onchange="storyFieldVisibility()">${[['message','收到一条微信消息'],['call','收到联系人来电'],['note','追加一段备忘录'],['redbook','发布一条小红书'],['weibo','发布一条微博']].map(([v,t])=>`<option value="${v}" ${n.action===v?'selected':''}>${t}</option>`).join('')}</select></label><label class="field" id="storyContactField">相关联系人（消息发送者 / 关键词会话）<select name="contact">${state.contacts.map(c=>`<option value="${esc(c.id)}" ${n.contact===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label class="field" id="storyBodyField">内容<textarea name="body" required style="min-height:150px">${esc(n.body)}</textarea></label><button class="primary">保存节点</button></form>`;storyFieldVisibility();el('storyForm').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.currentTarget));if(v.trigger==='message'&&!v.keyword.trim())return toast('请填写触发关键词');if((['message','chat'].includes(v.trigger)||['message','call'].includes(v.action))&&!v.contact)return toast('请先在通讯录添加联系人');const node={...v,id:id||uid()};if(id)Object.assign(n,node);else state.story.nodes.push(node);save();renderStory();toast('剧情节点已保存')}}
function storyFieldVisibility(){const f=el('storyForm');el('storyAppField').classList.toggle('hide',f.elements.trigger.value!=='app');el('storyKeywordField').classList.toggle('hide',f.elements.trigger.value!=='message');el('storyContactField').classList.toggle('hide',!['message','chat'].includes(f.elements.trigger.value)&&!['message','call'].includes(f.elements.action.value));el('storyBodyField').classList.toggle('hide',f.elements.action.value==='call');f.elements.body.required=f.elements.action.value!=='call'}
function moveStoryNode(id,delta){const a=state.story.nodes,i=a.findIndex(x=>x.id===id),j=i+delta;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();renderStory()}
function deleteStoryNode(id){if(!confirm('删除这个剧情节点？'))return;state.story.nodes=state.story.nodes.filter(n=>n.id!==id);state.story.done=state.story.done.filter(x=>x!==id);save();renderStory()}
function restartStory(){if(!confirm('重置剧情进度？已产生的消息和动态会保留。'))return;state.story.done=[];save();renderStory()}
function loadStoryDemo(){if(state.story.nodes.length&&!confirm('用示例替换现有故事线？手机内容会保留。'))return;if(!state.contacts.length)return toast('请先添加一个联系人');state.story={enabled:false,done:[],nodes:[{id:uid(),title:'一封迟来的消息',trigger:'app',target:'messages',action:'message',contact:state.contacts[0].id,body:'你还记得海边的约定吗？去 Safari 看看那封信。'},{id:uid(),title:'信里的线索',trigger:'app',target:'safari',action:'note',body:'线索：车站旁的咖啡馆，下午三点。给朋友回复「我记得」。'},{id:uid(),title:'赴约',trigger:'message',keyword:'我记得',contact:state.contacts[0].id,action:'message',body:'太好了。那就下午三点，老地方见。故事才刚刚开始。'}]};save();renderStory();toast('示例已载入，打开“剧情运行”开始试玩')}
function manualStory(){if(!state.story.enabled)return toast('请先开启剧情运行');const n=state.story.nodes.find(x=>!state.story.done.includes(x.id));if(!n)return toast('剧情已完成');if(n.trigger!=='manual')return toast('当前节点需要：'+(n.trigger==='app'?'打开'+appName(n.target):n.trigger==='chat'?'打开指定联系人的聊天':'向指定联系人发送关键词'));storyTrigger('manual','')}
function storyTrigger(type,value,contact=''){const s=state.story;if(!s.enabled||isLocked())return;const n=s.nodes.find(x=>!s.done.includes(x.id));if(!n||n.trigger!==type)return;if(type==='app'&&n.target!==value)return;if(type==='chat'&&n.contact!==value)return;if(type==='message'&&(!value.includes(n.keyword)||n.contact!==contact))return;if(['message','call'].includes(n.action)&&!state.contacts.some(c=>c.id===n.contact)){toast('剧情关联的联系人已删除，请编辑节点');return}if(n.action==='call'&&!canStartIncomingCall())return;const before=structuredClone(state);s.done.push(n.id);if(n.action==='message'){state.chats[n.contact]??=[];state.chats[n.contact].push({from:'them',text:n.body,at:Date.now()})}else if(n.action==='note')state.notes=(state.notes?state.notes+'\n\n':'')+n.body;else if(['redbook','weibo'].includes(n.action))state.social[n.action].unshift({id:uid(),author:state.profile.name,title:n.title,body:n.body,cover:'',likes:0,liked:false});if(!save()){state=before;return}if(n.action==='call'){showIncomingCall(n.contact);return}document.querySelector('.story-notice')?.remove();const notice=document.createElement('button');notice.className='story-notice';notice.innerHTML=`<strong>${n.action==='message'?'微信 · '+esc(state.contacts.find(c=>c.id===n.contact)?.name):'故事进展 · '+esc(n.title)}</strong>${esc(n.body.slice(0,85))}`;notice.onclick=()=>{notice.remove();if(isLocked())return;if(n.action==='message'){openApp('messages');openChat(n.contact)}else openApp(n.action==='note'?'notes':n.action)};el('shell').append(notice);setTimeout(()=>notice.remove(),6000);if(activeChat&&n.action==='message'&&activeChat===n.contact)renderChat();if(currentApp==='story')renderStory();else if(currentApp==='notes'&&n.action==='note')renderNotes();else if(currentApp==='messages'&&!activeChat)renderMessages();else if(currentApp===n.action&&['redbook','weibo'].includes(n.action))renderSocial(n.action)}
el('chatForm').addEventListener('submit',()=>{const last=state.chats[activeChat]?.at(-1);if(last?.from==='me')storyTrigger('message',last.text,activeChat)});

// Uploaded icons remain inside browser data and the existing JSON backups.
const editableIconApps=['photos','camera','redbook','weibo','messages','safari','notes'];
function iconArtwork(id,fallback=''){
  const custom=state.appIcons?.[id];
  if(custom)return `<img class="custom-app-icon" src="${esc(custom.data)}" alt="" style="transform:scale(${custom.zoom})">`;
  const bundled=bundledAppIcons[id];
  if(bundled)return `<img class="custom-app-icon bundled-app-icon" src="${bundled.data}" alt="" style="position:absolute;width:${bundled.width}%;height:${bundled.height}%;left:${bundled.left}%;top:${bundled.top}%">`;
  return art[id]||fallback;
}
function renderIconSettings(){
  nav('应用图标');
  el('appContent').innerHTML=`<h1 class="bigtitle">换上你的图标</h1><p class="muted">点按上传，可直接从手机相册选择图片。桌面和 Dock 同步替换，完整备份也会保存图标。</p><div class="card">${editableIconApps.map(id=>{const a=icons.find(x=>x[0]===id)||[id,'Safari','','white'];return `<div class="icon-edit-row"><div class="icon-edit-heading"><span class="app-icon" id="iconPreview-${id}" style="background:${a[3]}">${iconArtwork(id)}</span><div class="grow"><strong>${esc(a[1])}</strong><label class="icon-upload-label">${state.appIcons[id]?'替换图片':'上传图片'}<input type="file" accept="image/*" aria-label="上传${a[1]}图标" onchange="uploadAppIcon('${id}',this)"></label></div>${state.appIcons[id]?`<button class="bare muted" onclick="resetAppIcon('${id}')">还原</button>`:''}</div>${state.appIcons[id]?`<label class="icon-zoom-label">缩放 · 裁掉图片外围背景<input type="range" aria-label="${a[1]}图标缩放" min="1" max="1.6" step="0.02" value="${state.appIcons[id].zoom}" oninput="previewIconZoom('${id}',this.value)" onchange="saveIconZoom('${id}',this.value)"></label>`:''}</div>`}).join('')}</div><p class="muted">带黑边或背景的图片，可以拖动缩放滑杆，让图标铺满圆角方框。</p><button class="secondary-btn" onclick="homeScreen()">返回桌面查看</button>`;

async function uploadAppIcon(id,input){
  const file=input.files[0];if(!file)return;
  const data=await imageData(file,256);if(!data){input.value='';return}
  const previous=state.appIcons[id];state.appIcons[id]={data,zoom:1};
  if(!save()){if(previous)state.appIcons[id]=previous;else delete state.appIcons[id];input.value='';return}
  renderHome();renderIconSettings();toast('图标已更新');
}
function previewIconZoom(id,value){const img=el('iconPreview-'+id)?.querySelector('img');if(img)img.style.transform=`scale(${Math.min(1.6,Math.max(1,Number(value)||1))})`}
function saveIconZoom(id,value){const icon=state.appIcons[id];if(!icon)return;const previous=icon.zoom;icon.zoom=Math.min(1.6,Math.max(1,Number(value)||1));if(!save()){icon.zoom=previous;renderIconSettings();return}renderHome()}
function resetAppIcon(id){const previous=state.appIcons[id];delete state.appIcons[id];if(!save()){state.appIcons[id]=previous;return}renderHome();renderIconSettings();toast('已还原默认图标')}

async function saveCameraPhoto(input){
  const file=input.files[0];if(!file)return;
  const data=await imageData(file);if(!data){input.value='';return}
  const photo={id:uid(),name:file.name||'相机照片',data,at:Date.now()};state.photos.push(photo);
  if(!save()){state.photos=state.photos.filter(p=>p.id!==photo.id);input.value='';return}
  renderHome();if(currentApp==='camera')renderCamera();toast('照片已保存到相册');
}

function isBaiduAddress(value){return ['百度','baidu','baidu.com','www.baidu.com'].includes(value.toLowerCase())||/^https?:\/\/(www\.)?baidu\.com(?:[/?#]|$)/i.test(value)}

// Stable message IDs keep editing safe when an automatic reply arrives in the background.
function wcPrepareSingleMessages(contactId){
  if(!Array.isArray(state.chats[contactId]))state.chats[contactId]=[];
  const seen=new Set();
  for(const message of state.chats[contactId]){
    if(typeof message.id!=='string'||!message.id||seen.has(message.id))message.id=uid();
    seen.add(message.id);
    if(!Number.isFinite(Number(message.at)))message.at=Date.now();else message.at=Number(message.at);
  }
  return state.chats[contactId];
}
function wcMessageDatetime(at){const date=new Date(at);return new Date(date.getTime()-date.getTimezoneOffset()*60000).toISOString().slice(0,19)}
function wcHistoryTime(at){return new Date(at).toLocaleString('zh-CN',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}
function wcChatTimestamp(at,previous,force=false){if(force)return `<time class="wc-chat-timestamp">${esc(new Date(at).toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}))}</time>`;if(previous&&Math.abs(at-previous)<5*60*1000&&new Date(at).toDateString()===new Date(previous).toDateString())return '';const date=new Date(at),time=date.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}),today=new Date();const day=date.toDateString()===today.toDateString()?'':wcTime(at)+' ';return `<time class="wc-chat-timestamp">${esc(day+time)}</time>`}

function editSingleMessage(contactId,messageId=''){
  const contact=state.contacts.find(c=>c.id===contactId);if(!contact)return;

  const messages=wcPrepareSingleMessages(contactId),message=messageId?messages.find(m=>m.id===messageId):{from:'them',text:'',at:Date.now()};

  el('wcSingleMessageForm').onsubmit=event=>{

function deleteSingleMessage(contactId,messageId){

function storageUpdateSoon(){queueMicrotask(storageRenderStatus)}
function storageOpenDatabase(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new DOMException('IndexedDB unavailable','NotSupportedError'));let request;try{request=indexedDB.open('phone-life-local-data',1)}catch(error){reject(error);return}request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('snapshots'))request.result.createObjectStore('snapshots')};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||Error('Unable to open storage'));request.onblocked=()=>reject(Error('Close another older version of this phone to open storage'))})}
function storageReadRecord(db){return new Promise((resolve,reject)=>{let transaction;try{transaction=db.transaction('snapshots','readonly')}catch(error){reject(error);return}const request=transaction.objectStore('snapshots').get(KEY);let value;request.onsuccess=()=>value=request.result;transaction.oncomplete=()=>resolve(value);transaction.onabort=()=>reject(transaction.error||Error('Read aborted'));transaction.onerror=()=>{}})}
function storageWriteRecord(db,json){return new Promise((resolve,reject)=>{let transaction;try{transaction=db.transaction('snapshots','readwrite');transaction.objectStore('snapshots').put({json,format:1,savedAt:Date.now()},KEY)}catch(error){try{transaction?.abort()}catch{}reject(error);return}transaction.oncomplete=()=>resolve();transaction.onabort=()=>reject(transaction.error||new DOMException('Write aborted','AbortError'));transaction.onerror=()=>{}})}
function storageValidateState(value){return value&&typeof value==='object'&&value.profile&&Array.isArray(value.contacts)&&Array.isArray(value.photos)}
function storageUseIndexedDB(){
  phoneStorage.mode='indexeddb';
  window.phoneStorageWrite=current=>{let json;try{json=JSON.stringify(current)}catch{storageBaseToast('内容无法保存，请先导出备份');return false}phoneStorage.pending={json,version:++phoneStorage.version};phoneStorage.error='';phoneStorage.phase='saving';storageUpdateSoon();storageFlush();return true};
  window.phoneStorageBooting=false;
}
async function storageFlush(){
  if(phoneStorage.busy||!phoneStorage.pending||!phoneStorage.db)return;
  phoneStorage.busy=true;
  while(phoneStorage.pending){
    const snapshot=phoneStorage.pending;phoneStorage.pending=null;
    try{await storageWriteRecord(phoneStorage.db,snapshot.json);phoneStorage.committed=snapshot.version}
    catch(error){if(!phoneStorage.pending||phoneStorage.pending.version<snapshot.version)phoneStorage.pending=snapshot;phoneStorage.phase='error';phoneStorage.error=storageErrorText(error);phoneStorage.busy=false;phoneStorage.deferredToast='';storageRenderStatus();return}
  }
  phoneStorage.busy=false;phoneStorage.phase='saved';phoneStorage.error='';storageRenderStatus();
  if(phoneStorage.deferredToast){const message=phoneStorage.deferredToast;phoneStorage.deferredToast='';storageBaseToast(message)}
}
async function retryPhoneStorage(){
  if(phoneStorage.phase==='blocked'){await initializePhoneStorage();return}
  if(phoneStorage.mode==='localstorage'){if(save()){phoneStorage.phase='saved';phoneStorage.error='';storageRenderStatus();storageBaseToast('已保存')}return}
  if(phoneStorage.mode!=='indexeddb')return;
  if(!phoneStorage.db){try{storageAttachDatabase(await storageOpenDatabase());storageUseIndexedDB()}catch(error){phoneStorage.error=storageErrorText(error);storageRenderStatus();return}}
  phoneStorage.pending=null;phoneStorage.error='';if(save())storageRenderStatus();
}
function storageRestoreScreen(){
  activeChat='';activeGroup='';el('chatView').classList.remove('active');el('photoView').classList.remove('active');currentApp='';el('appScreen').classList.remove('active');el('shell').classList.remove('in-app','is-locked');el('lock').classList.remove('active');renderHome();
  if(state.settings.locked)toggleLock(true);
}
async function initializePhoneStorage(){
  if(phoneStorage.db&&!phoneStorage.busy){phoneStorage.db.close();phoneStorage.db=null}
  phoneStorage.initializing=true;phoneStorage.phase='loading';storageLoader.innerHTML=storageLoadingHTML;storageLoader.classList.remove('hide');storageBanner.classList.add('hide');
  let db;
  try{db=await storageOpenDatabase()}
  catch(error){
    let priorBackend='',legacyReadable=true;try{priorBackend=localStorage.getItem('phone-life-storage-backend')||''}catch{legacyReadable=false}
    if(priorBackend==='indexeddb-v1'||!legacyReadable){phoneStorage.phase='blocked';phoneStorage.error=legacyReadable?'无法读取此前的本机数据，请重试或使用原来的浏览器窗口。':'浏览器禁止读取本机数据，请使用允许本地存储的普通窗口。';phoneStorage.mode='blocked';window.phoneStorageWrite=()=>{storageRenderStatus();return false};window.phoneStorageBooting=false;phoneStorage.initializing=false;storageRenderStatus();storageBlockedScreen();return}
    phoneStorage.mode='localstorage';phoneStorage.phase='saved';window.phoneStorageWrite=null;window.phoneStorageBooting=false;phoneStorage.initializing=false;storageLoader.classList.add('hide');storageRenderStatus();storageBaseToast('浏览器不支持扩展存储，已使用兼容模式；请定期导出备份');return;
  }
  storageAttachDatabase(db);
  try{
    const record=await storageReadRecord(db);
    if(record){const restored=JSON.parse(record.json);if(!storageValidateState(restored))throw Error('Invalid stored state');const previous=state;state=restored;try{normalize()}catch(error){state=previous;throw error}}
    storageUseIndexedDB();
    // Commit a verified copy before considering migration complete. The legacy key is retained.
    if(!record){const json=JSON.stringify(state);await storageWriteRecord(db,json)}
    try{localStorage.setItem('phone-life-storage-backend','indexeddb-v1')}catch{}
    phoneStorage.phase='saved';phoneStorage.initializing=false;storageRestoreScreen();storageLoader.classList.add('hide');storageRenderStatus();
    if(/本地空间不足|浏览器本地存储已满/.test(el('toast').textContent))el('toast').style.display='none';
  }catch(error){
    phoneStorage.phase='blocked';phoneStorage.mode='blocked';phoneStorage.error=error?.name==='QuotaExceededError'?'浏览器没有足够的存储空间，迁移暂未完成。':error?.name==='SecurityError'?'浏览器阻止了扩展存储，请在允许保存数据的普通窗口打开。':'无法完成本机数据读取或迁移，原存储没有被清除。';window.phoneStorageWrite=()=>{storageRenderStatus();return false};window.phoneStorageBooting=false;phoneStorage.initializing=false;storageRenderStatus();storageBlockedScreen();
  }
}
window.addEventListener('beforeunload',event=>{if(phoneStorage.busy||phoneStorage.pending||phoneStorage.phase==='error'){event.preventDefault();event.returnValue=''}});
const storageBaseSettings=renderSettings;
renderSettings=()=>{storageBaseSettings();const bytes=new Blob([JSON.stringify(state)]).size;el('appContent').querySelector('h1')?.insertAdjacentHTML('afterend',`<div class="card"><strong>本机数据存储</strong><p class="muted" id="phoneStorageSettingsStatus"></p><p class="muted">当前数据约 ${(bytes/1024/1024).toFixed(2)} MB。照片、壁纸与聊天使用浏览器扩展存储，数据仍保存在本机。</p><button class="secondary-btn" onclick="exportBackup()">导出完整备份</button></div>`);storageRenderStatus()};
phoneStorage.ready=initializePhoneStorage();
</script></body></html>
